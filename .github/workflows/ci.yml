name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # TypeCheck + ESLint com continue-on-error para não bloquear commits.
  # O repositório é privado (GitHub Free) com limite de minutos de Actions.
  # Este workflow valida mas não impede o push — apenas sinaliza problemas.
  quality:
    name: TypeCheck + ESLint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        run: npx eslint src/ --max-warnings 0
        continue-on-error: true
