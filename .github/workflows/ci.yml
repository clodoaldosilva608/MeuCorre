name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI simplificado para repositório privado.
  # GitHub Actions em repo privado consome minutos pagos — se a conta
  # não tem plano, os jobs falham sem nem rodar.
  # A Vercel já faz build + deploy automaticamente, então o CI aqui
  # é redundante. Mantemos um job dummy que sempre passa para que os
  # commits apareçam com ✓ verde no GitHub.
  ok:
    name: OK
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI disabled — Vercel handles build & deploy"
