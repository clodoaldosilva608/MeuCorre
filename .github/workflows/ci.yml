name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint + TypeCheck + Build (rápido, roda em todos os PRs)
  quality:
    name: Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings 0

      - name: Build
        run: npm run build
        env:
          # CI não tem DATABASE_URL real — usa fake URL para compilação
          # prisma db push roda apenas na Vercel (vercel.json buildCommand)
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"
          ADMIN_EMAIL: "ci@test.com"
          ADMIN_PASSWORD: "cipassword123456"
          ADMIN_JWT_SECRET: "ci-secret-admin-32chars-minimum"
          USER_JWT_SECRET: "ci-secret-user-32chars-minimum"
          KIWIFY_WEBHOOK_SECRET: "ci-kiwify-secret"
          KIWIFY_PRODUCT_ID: "ci-product-id"
          NEXT_PUBLIC_KIWIFY_PRODUCT_SLUG: "ci-slug"
          PLAN_PRICE: "18.9"
          NEXT_PUBLIC_APP_URL: "https://ci.test"

  # Job 2: E2E tests (só roda em push para main, não em PRs)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against production
        run: npx playwright test --project=chromium-desktop --reporter=list
        env:
          E2E_TEST_BYPASS_TOKEN: ${{ secrets.E2E_TEST_BYPASS_TOKEN }}
          SKIP_KIWIFY_REDIRECT: "1"
        continue-on-error: true # E2E em CI pode flakar; não bloqueia deploy

  # Job 3: Security audit (npm audit)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+critical only)
        run: npm audit --audit-level=high --omit=dev || true
