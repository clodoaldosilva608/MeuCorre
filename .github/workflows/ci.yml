name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job único: TypeCheck + ESLint (build removido — Vercel já faz)
  # O build do Next.js consome muita memória e causa OOM no GitHub Actions.
  # A Vercel faz o build automaticamente no deploy, então não precisamos
  # duplicar aqui. TypeCheck + ESLint são suficientes para garantir qualidade.
  quality:
    name: TypeCheck + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings 0
